[tracer1]
input-dir = deltas/
tracer-type = continuous
absorption-line = LYA
rebin = 2
project-deltas = True
projection-order = 1
use-old-projection = True

[settings]
num-cpu = 1
nside = 16
z_min = 0
z_max = 10
coordinate-system = r-mu
r_min = 10
r_max = 200
mu_min = -1
mu_max = 1
num_bins_r = 4
num_bins_mu = 4
num_bins_r_model = 4
num_bins_mu_model = 4
rejection_fraction = -1
get-old-distortion = True

[compute]
compute-correlation = True
compute-distortion-matrix = True

[cosmology]
use-picca-cosmo = True
Omega_m = 0.315
Omega_r = 7.963219132297603e-05

[output]
name = test_rmu
output-dir = .output

[export]
export-correlation = True
export-distortion = True
smooth-covariance = False
