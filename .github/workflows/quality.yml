name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install MPI system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libbz2-dev mpich libmpich-dev
      - name: Install package and developer tools
        run: |
          python -m pip install --upgrade pip
          MPICC=mpicc python -m pip install --no-binary=mpi4py mpi4py
          python -m pip install -e '.[dev]'
      - name: Check formatting and lint
        run: |
          ruff format --check .
          ruff check .
      - name: Build distributions
        run: |
          python -m build
          twine check dist/*
      - name: Test built wheel
        run: |
          python -m pip uninstall --yes lya_2pt
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          python -m pytest "$GITHUB_WORKSPACE/tests" --cov=lya_2pt --cov-report=xml:"$GITHUB_WORKSPACE/coverage.xml"
      - name: Upload coverage
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v4
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: coverage.xml
          flags: unit
          fail_ci_if_error: false

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install MPI system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libbz2-dev mpich libmpich-dev
      - name: Build documentation with warnings as errors
        run: |
          python -m pip install --upgrade pip
          MPICC=mpicc python -m pip install --no-binary=mpi4py mpi4py
          python -m pip install -e '.[docs]'
          sphinx-build --fail-on-warning --keep-going -b html docs docs/_build/html
