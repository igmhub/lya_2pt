name: MPI smoke test

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mpi-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install MPICH and the package
        run: |
          sudo apt-get update
          sudo apt-get install --yes libbz2-dev mpich libmpich-dev
          python -m pip install --upgrade pip
          MPICC=mpicc python -m pip install --no-binary=mpi4py mpi4py
          python -m pip install -e '.[dev]'
      - name: Run one-rank MPI workflow
        working-directory: tests
        run: mpiexec -n 1 lya-2pt-mpi -i configs/lyaxlya_cf.ini
