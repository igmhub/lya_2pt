name: Bug report
description: Report incorrect behavior or a regression.
title: "bug: "
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened?
      description: Include the command, configuration, and expected behavior.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Environment
      description: Include lya_2pt version, Python version, platform, and MPI implementation.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction
      description: Provide minimal data or a minimal configuration when possible.
